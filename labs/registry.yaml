# PortSwigger Web Security Academy 题目注册表（评测用测试集）
#
# 使用方法：
#   1. 登录 https://portswigger.net/web-security（免费注册），进入题目页点击 Launch lab
#   2. 把得到的实例地址（形如 https://0a2b008f03xxxx.web-security-academy.net）
#      粘贴到对应题目的 lab_url 字段，或运行时用 --url 临时传入
#   3. python main.py run --lab <id> --url <实例地址>
#
# 注意：实例闲置约 1 小时会过期，过期后重新 Launch 即可（地址会变化）。
# 全部为单机可解的经典题（无需 Burp Collaborator 外带）。

